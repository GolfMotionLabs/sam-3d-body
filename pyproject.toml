[project]
name = "sam-3d-body"
version = "0.1.0"
description = "minimal run-time sam-3d-body fork"
readme = "README.md"
authors = [
    { name = "Thomash02", email = "tuomas.haapasalo02@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "braceexpand>=0.1.7",
    "omegaconf>=2.3.0",
    "pytorch-lightning>=2.6.1",
    "roma>=1.5.6",
    "sam3>=0.1.3",
    "yacs>=0.1.8",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["sam_3d_body", "sam_3d_body.*", "tools", "tools.*"]
